  wallet:
    address: sn.wallet.events.v1
    description: "Events of stream_type 'wallet' (contracts in src/shared/contracts/events/wallet.events.ts)."
    messages:
      wallet_topup_succeeded:
        $ref: '#/components/messages/wallet_topup_succeeded'
      wallet_topup_failed:
        $ref: '#/components/messages/wallet_topup_failed'
      wallet_escrow_held:
        $ref: '#/components/messages/wallet_escrow_held'
      wallet_escrow_hold_failed:
        $ref: '#/components/messages/wallet_escrow_hold_failed'
      wallet_escrow_released:
        $ref: '#/components/messages/wallet_escrow_released'
      wallet_escrow_refunded:
        $ref: '#/components/messages/wallet_escrow_refunded'
      wallet_payout_requested:
        $ref: '#/components/messages/wallet_payout_requested'
      wallet_payout_settled:
        $ref: '#/components/messages/wallet_payout_settled'
      wallet_payout_failed:
        $ref: '#/components/messages/wallet_payout_failed'
  dlq:
    address: sn.dlq.v1
    description: "Dead letters: { original_topic, consumer_group, error, attempts, envelope }."
    messages:
      dead_letter:
        $ref: '#/components/messages/dead_letter'
