      type: object
      properties:
        type: { type: string, description: event type }
        correlation_id: { type: string }
    Actor:
      type: object
      required: [type, id]
      properties:
        type: { type: string, enum: [user, system, agent] }
        id: { type: string }
        role: { type: string, description: 'user role (worker, admin, manager, ops)' }
    EventEnvelope:
      type: object
      description: src/shared/events/event-envelope.ts
      required: [event_id, type, version, stream_type, stream_id, occurred_at, actor, correlation_id, payload]
      properties:
        event_id: { type: string, format: uuid }
        type: { type: string, description: 'e.g. shift.accepted' }
        version: { type: integer, description: 'payload schema version; older versions are upcast on read' }
        stream_type: { type: string, enum: [shift, wallet, identity, rating, exception, decision] }
        stream_id: { type: string, format: uuid }
        stream_version: { type: [integer, 'null'], description: 'set for event-sourced streams (shift)' }
        occurred_at: { type: string, format: date-time }
        company_id: { type: [integer, 'null'] }
        actor: { $ref: '#/components/schemas/Actor' }
        correlation_id: { type: string }
        causation_id: { type: [string, 'null'] }
        idempotency_key: { type: string }
        payload: { type: object, description: 'per event type, see the contracts file; money fields are integer VND' }
