# Generated from server-api/src/shared/contracts/events/*.ts (the TypeScript contracts are the source of truth;
# payload fields are documented there). Regenerate after adding an event type. See docs/ARCHITECTURE.md §6.
asyncapi: 3.0.0
info:
  title: Shift Network integration events
  version: 0.1.0
  description: >
    At-least-once delivery through the transactional outbox (outbox_messages) and relay. Consumers are idempotent
    per (consumer group, event_id) via processed_messages. Partition key = stream_id, so events of one aggregate
    are ordered. After 5 failed attempts a message goes to dlq_messages + sn.dlq.v1 and can be replayed from
    /api/sn/ops/dlq. MESSAGE_BUS_DRIVER=memory replaces Kafka with an in-process broker (single process only).
defaultContentType: application/json
servers:
  dev:
    host: localhost:9092
    protocol: kafka
    description: docker-compose.dev.yml (apache/kafka 3.9 KRaft)
channels:
  decision:
    address: sn.decision.events.v1
    description: "Events of stream_type 'decision' (contracts in src/shared/contracts/events/decision.events.ts)."
    messages:
      decision_recorded:
        $ref: '#/components/messages/decision_recorded'
  exception:
    address: sn.exception.events.v1
    description: "Events of stream_type 'exception' (contracts in src/shared/contracts/events/exception.events.ts)."
    messages:
      exception_case_opened:
        $ref: '#/components/messages/exception_case_opened'
      exception_case_resolved:
        $ref: '#/components/messages/exception_case_resolved'
  identity:
    address: sn.identity.events.v1
    description: "Events of stream_type 'identity' (contracts in src/shared/contracts/events/identity.events.ts)."
    messages:
      identity_worker_registered:
        $ref: '#/components/messages/identity_worker_registered'
      identity_worker_profile_updated:
        $ref: '#/components/messages/identity_worker_profile_updated'
      identity_employer_registered:
        $ref: '#/components/messages/identity_employer_registered'
      identity_employer_profile_updated:
        $ref: '#/components/messages/identity_employer_profile_updated'
      identity_work_location_created:
        $ref: '#/components/messages/identity_work_location_created'
      identity_work_location_updated:
        $ref: '#/components/messages/identity_work_location_updated'
  rating:
    address: sn.rating.events.v1
    description: "Events of stream_type 'rating' (contracts in src/shared/contracts/events/rating.events.ts)."
    messages:
      rating_reputation_changed:
        $ref: '#/components/messages/rating_reputation_changed'
  shift:
    address: sn.shift.events.v1
    description: "Events of stream_type 'shift' (contracts in src/shared/contracts/events/shift.events.ts)."
    messages:
      shift_posted:
        $ref: '#/components/messages/shift_posted'
      shift_offered:
        $ref: '#/components/messages/shift_offered'
      shift_offer_declined:
        $ref: '#/components/messages/shift_offer_declined'
      shift_offer_expired:
        $ref: '#/components/messages/shift_offer_expired'
      shift_accepted:
        $ref: '#/components/messages/shift_accepted'
      shift_escrow_funded:
        $ref: '#/components/messages/shift_escrow_funded'
      shift_worker_withdrew:
        $ref: '#/components/messages/shift_worker_withdrew'
      shift_rematch_requested:
        $ref: '#/components/messages/shift_rematch_requested'
      shift_worker_checked_in:
        $ref: '#/components/messages/shift_worker_checked_in'
      shift_no_show_recorded:
        $ref: '#/components/messages/shift_no_show_recorded'
      shift_worker_checked_out:
        $ref: '#/components/messages/shift_worker_checked_out'
      shift_disputed:
        $ref: '#/components/messages/shift_disputed'
      shift_dispute_resolved:
        $ref: '#/components/messages/shift_dispute_resolved'
      shift_completed:
        $ref: '#/components/messages/shift_completed'
      shift_paid:
        $ref: '#/components/messages/shift_paid'
      shift_rated:
        $ref: '#/components/messages/shift_rated'
      shift_ratings_closed:
        $ref: '#/components/messages/shift_ratings_closed'
      shift_cancelled:
        $ref: '#/components/messages/shift_cancelled'
